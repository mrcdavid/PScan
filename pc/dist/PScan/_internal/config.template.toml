# PScan settings. Restart PScan (tray icon -> Quit, then start it again) after editing.
# This copy is created the first time the installed PScan runs.

# Name the phone shows for this PC. Empty = the Windows computer name.
server_name = ""

# HTTP port the phone uploads to, and UDP port used to find this PC automatically.
port = 8765
discovery_port = 8766

# Where finished PDFs are saved. Left unset so PScan uses "<your user folder>\PScan Scans".
# Change it from the tray (Change Scans folder…), or set an absolute path here, e.g.
# output_dir = "D:/Scans"
# output_dir =

# Default look of scanned pages: "color", "gray" or "bw" (black & white text).
default_mode = "color"

# Default PDF page size: "A4", "Letter", "Long" (8.5 x 13 in), "Legal" or "Original".
# The phone app can pick another size per scan.
paper = "A4"

# Searchable PDFs (the installer includes the Tesseract OCR engine).
ocr = true
# Tesseract languages, e.g. "eng" or "eng+fil".
ocr_lang = "eng"
# Full path to tesseract.exe. Empty = use the bundled copy / find it automatically.
tesseract_path = ""

# Pages are limited to this many pixels on the long side (3000 ~ 300 DPI on A4/Letter).
max_long_edge = 3000
jpeg_quality = 85
